name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately trivial, dependency-free, deterministic check.
      # The canary repo intentionally has no build/test suite; verification
      # must pass in a fresh, network-less sandbox.
      - name: Verify README exists
        run: test -f README.md
